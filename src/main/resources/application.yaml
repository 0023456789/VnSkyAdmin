server:
  servlet:
    context-path: /api/v1

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: adminsky
  datasource:
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5432/${POSTGRES_DB:mvno_plan}}
    username: ${DBMS_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DBMS_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
